<header>
{{if isfr}}
<div class="blog-name"><a href="/fr/">Anas Bouali</a></div>
{{else}}
<div class="blog-name"><a href="/">Anas Bouali</a></div>
{{end}}

<!-- language flags : UK = English site, FR = French site -->
<span class="lang-switch">
  <a href="/" title="English">
    <svg viewBox="0 0 60 30" width="22" height="15" aria-hidden="true">
      <clipPath id="uk-t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
      <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
      <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
      <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/>
      <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
      <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
    </svg>
  </a>
  <a href="/fr/" title="Français">
    <svg viewBox="0 0 3 2" width="22" height="15" aria-hidden="true">
      <rect width="1" height="2" fill="#0055A4"/>
      <rect x="1" width="1" height="2" fill="#fff"/>
      <rect x="2" width="1" height="2" fill="#EF4135"/>
    </svg>
  </a>
</span>

<nav>
  <ul>
    {{if isfr}}
    <!-- 👇 FRENCH MENU: Links point to /fr/ versions of the pages -->
    <li><a href="/fr/Publications/">Publications</a></li>
    <li><a href="/fr/Talks/">Conférences</a></li>
    <li><a href="/fr/Projects/">Projets</a></li>
    <li><a href="/Code/">Code</a></li>
    <li><a href="/fr/Teaching/">Enseignement</a></li>
    {{else}}
    <!-- 👇 ENGLISH MENU: Links point to the English pages -->
    <li><a href="/Publications/">Publications</a></li>
    <li><a href="/Talks/">Talks</a></li>
    <li><a href="/Projects/">Projects</a></li>
    <li><a href="/Code/">Code</a></li>
    <li><a href="/Teaching/">Teaching</a></li>
    {{end}}
  </ul>
  <img src="/assets/hamburger.svg" id="menu-icon" alt="Menu">
</nav>
</header>
